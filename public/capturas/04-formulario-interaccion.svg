<svg viewBox="0 0 860 380" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, sans-serif">
  <rect width="860" height="380" fill="#f1f5f9" rx="12"/>
  <text x="24" y="36" font-size="15" font-weight="600" fill="#2563eb">Interacción — Agregar, Eliminar y Lista vacía</text>

  <!-- Panel izquierdo: Agregar -->
  <rect x="16" y="52" width="390" height="180" rx="12" fill="white" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="36" y="76" font-size="12" font-weight="600" fill="#2563eb">Agregar nuevo producto</text>

  <!-- campos form -->
  <rect x="28" y="86" width="110" height="30" rx="7" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="36" y="97" font-size="8" fill="#64748b" font-weight="600">NOMBRE</text>
  <text x="36" y="111" font-size="11" fill="#1e293b">Webcam Full HD</text>

  <rect x="148" y="86" width="90" height="30" rx="7" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="156" y="97" font-size="8" fill="#64748b" font-weight="600">PRECIO (USD)</text>
  <text x="156" y="111" font-size="11" fill="#1e293b">79.99</text>

  <rect x="248" y="86" width="90" height="30" rx="7" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="256" y="97" font-size="8" fill="#64748b" font-weight="600">CATEGORÍA</text>
  <text x="256" y="111" font-size="11" fill="#1e293b">Accesorios</text>

  <rect x="28" y="126" width="120" height="24" rx="8" fill="#16a34a"/>
  <text x="88" y="142" font-size="11" fill="white" font-weight="600" text-anchor="middle">Guardar Producto</text>

  <!-- Alert éxito -->
  <rect x="28" y="158" width="348" height="26" rx="7" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="36" y="175" font-size="11" fill="#166534">✅ ¡Producto agregado correctamente!</text>

  <!-- Lista con nuevo item -->
  <rect x="28" y="192" width="348" height="28" rx="0" fill="white" stroke="#f0fdf4" stroke-width="1"/>
  <text x="36" y="210" font-size="11" fill="#1e293b" font-weight="600">Laptop Pro 15"</text>
  <text x="270" y="210" font-size="11" fill="#1e293b" font-family="monospace">$1,299.99</text>
  <rect x="348" y="196" width="24" height="16" rx="5" fill="#dc2626"/>
  <text x="360" y="208" font-size="9" fill="white" text-anchor="middle">🗑</text>

  <rect x="28" y="220" width="348" height="28" rx="0" fill="#f0fdf4"/>
  <text x="36" y="238" font-size="11" fill="#16a34a" font-weight="600">Webcam Full HD ✨ nuevo</text>
  <text x="270" y="238" font-size="11" fill="#16a34a" font-family="monospace">$79.99</text>
  <rect x="348" y="224" width="24" height="16" rx="5" fill="#dc2626"/>
  <text x="360" y="236" font-size="9" fill="white" text-anchor="middle">🗑</text>

  <text x="390" y="262" font-size="10" fill="#64748b" text-anchor="end">Total: <tspan font-weight="700" fill="#1e293b">6</tspan></text>

  <!-- Panel central: Eliminar -->
  <rect x="420" y="52" width="220" height="180" rx="12" fill="white" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="440" y="76" font-size="12" font-weight="600" fill="#dc2626">Eliminar producto</text>

  <rect x="432" y="86" width="196" height="28" rx="0" fill="white"/>
  <text x="440" y="104" font-size="11" fill="#1e293b" font-weight="600">Laptop Pro 15"</text>
  <rect x="600" y="90" width="24" height="16" rx="5" fill="#dc2626"/>
  <text x="612" y="102" font-size="9" fill="white" text-anchor="middle">🗑</text>

  <rect x="432" y="114" width="196" height="28" rx="0" fill="#fef2f2"/>
  <text x="440" y="131" font-size="11" fill="#dc2626" font-weight="600" text-decoration="line-through" opacity="0.6">Auriculares Bluetooth</text>

  <rect x="432" y="142" width="196" height="28" rx="0" fill="white"/>
  <text x="440" y="160" font-size="11" fill="#1e293b" font-weight="600">Teclado Mecánico RGB</text>
  <rect x="600" y="146" width="24" height="16" rx="5" fill="#dc2626"/>
  <text x="612" y="158" font-size="9" fill="white" text-anchor="middle">🗑</text>

  <rect x="432" y="170" width="196" height="28" rx="0" fill="white"/>
  <text x="440" y="188" font-size="11" fill="#1e293b" font-weight="600">Monitor 4K 27"</text>
  <rect x="600" y="174" width="24" height="16" rx="5" fill="#dc2626"/>
  <text x="612" y="186" font-size="9" fill="white" text-anchor="middle">🗑</text>

  <text x="628" y="218" font-size="10" fill="#dc2626" text-anchor="end">−1 eliminado</text>
  <text x="628" y="232" font-size="10" fill="#64748b" text-anchor="end">Total: <tspan font-weight="700" fill="#1e293b">4</tspan></text>

  <!-- Panel derecho: Lista vacía -->
  <rect x="656" y="52" width="188" height="180" rx="12" fill="white" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="750" y="76" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Lista vacía (*ngIf)</text>

  <rect x="668" y="86" width="164" height="108" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="750" y="128" font-size="26" text-anchor="middle">📦</text>
  <text x="750" y="148" font-size="11" fill="#1e293b" font-weight="600" text-anchor="middle">No hay productos</text>
  <text x="750" y="163" font-size="9" fill="#64748b" text-anchor="middle">en la lista.</text>
  <text x="750" y="176" font-size="9" fill="#64748b" text-anchor="middle">¡Agregá el primero!</text>

  <rect x="668" y="200" width="164" height="24" rx="6" fill="#fefce8" stroke="#fde68a" stroke-width="1"/>
  <text x="750" y="216" font-size="9" fill="#854d0e" text-anchor="middle">*ngIf="productos.length === 0"</text>

  <!-- Línea separadora inferior -->
  <line x1="16" y1="280" x2="844" y2="280" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Código ngOnInit -->
  <rect x="16" y="290" width="828" height="74" rx="10" fill="#1e293b"/>
  <text x="36" y="308" font-size="10" fill="#94a3b8" font-family="monospace">// lista-productos.component.ts — Inyección del servicio y ciclo de vida ngOnInit</text>
  <text x="36" y="325" font-size="10" fill="#c4b5fd" font-family="monospace">constructor</text>
  <text x="104" y="325" font-size="10" fill="#7dd3fc" font-family="monospace">(private productosService: ProductosService) {}</text>
  <text x="36" y="342" font-size="10" fill="#c4b5fd" font-family="monospace">ngOnInit</text>
  <text x="90" y="342" font-size="10" fill="#7dd3fc" font-family="monospace">(): </text>
  <text x="108" y="342" font-size="10" fill="#fde68a" font-family="monospace">void</text>
  <text x="136" y="342" font-size="10" fill="#7dd3fc" font-family="monospace"> { this.productos = this.productosService.</text>
  <text x="430" y="342" font-size="10" fill="#c4b5fd" font-family="monospace">getProductos</text>
  <text x="510" y="342" font-size="10" fill="#7dd3fc" font-family="monospace">(); }</text>
  <text x="36" y="358" font-size="10" fill="#c4b5fd" font-family="monospace">eliminarProducto</text>
  <text x="136" y="358" font-size="10" fill="#7dd3fc" font-family="monospace">(id: </text>
  <text x="166" y="358" font-size="10" fill="#fde68a" font-family="monospace">number</text>
  <text x="208" y="358" font-size="10" fill="#7dd3fc" font-family="monospace">) { this.productosService.</text>
  <text x="342" y="358" font-size="10" fill="#c4b5fd" font-family="monospace">deleteProducto</text>
  <text x="424" y="358" font-size="10" fill="#7dd3fc" font-family="monospace">(id); this.productos = this.productosService.</text>
  <text x="668" y="358" font-size="10" fill="#c4b5fd" font-family="monospace">getProductos</text>
  <text x="748" y="358" font-size="10" fill="#7dd3fc" font-family="monospace">(); }</text>
</svg>
