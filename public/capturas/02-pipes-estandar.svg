<svg viewBox="0 0 860 310" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, sans-serif">
  <rect width="860" height="310" fill="#f1f5f9" rx="12"/>

  <text x="24" y="36" font-size="15" font-weight="600" fill="#2563eb">Pipes estándar en funcionamiento</text>
  <rect x="210" y="18" width="72" height="22" rx="6" fill="#eff6ff"/>
  <text x="246" y="33" font-size="11" fill="#2563eb" font-weight="700" text-anchor="middle">currency</text>
  <text x="292" y="33" font-size="13" fill="#64748b">y</text>
  <rect x="304" y="18" width="44" height="22" rx="6" fill="#eff6ff"/>
  <text x="326" y="33" font-size="11" fill="#2563eb" font-weight="700" text-anchor="middle">date</text>

  <!-- Card currency -->
  <rect x="16" y="52" width="400" height="220" rx="12" fill="white" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="36" y="80" font-size="11" fill="#64748b" font-weight="700">💰  PIPE CURRENCY — PRECIOS EN USD</text>

  <line x1="28" y1="88" x2="404" y2="88" stroke="#f1f5f9" stroke-width="1"/>
  <text x="36" y="110" font-size="12" fill="#64748b">Laptop Pro 15"</text>
  <text x="398" y="110" font-size="12" fill="#1e293b" font-weight="600" font-family="monospace" text-anchor="end">$1,299.99</text>

  <line x1="28" y1="118" x2="404" y2="118" stroke="#f8fafc" stroke-width="1"/>
  <text x="36" y="140" font-size="12" fill="#64748b">Auriculares Bluetooth</text>
  <text x="398" y="140" font-size="12" fill="#1e293b" font-weight="600" font-family="monospace" text-anchor="end">$89.99</text>

  <line x1="28" y1="148" x2="404" y2="148" stroke="#f8fafc" stroke-width="1"/>
  <text x="36" y="170" font-size="12" fill="#64748b">Teclado Mecánico RGB</text>
  <text x="398" y="170" font-size="12" fill="#1e293b" font-weight="600" font-family="monospace" text-anchor="end">$149.99</text>

  <line x1="28" y1="178" x2="404" y2="178" stroke="#f8fafc" stroke-width="1"/>
  <text x="36" y="200" font-size="12" fill="#64748b">Monitor 4K 27"</text>
  <text x="398" y="200" font-size="12" fill="#1e293b" font-weight="600" font-family="monospace" text-anchor="end">$549.99</text>

  <line x1="28" y1="208" x2="404" y2="208" stroke="#f8fafc" stroke-width="1"/>
  <text x="36" y="230" font-size="12" fill="#64748b">Mouse Ergonómico</text>
  <text x="398" y="230" font-size="12" fill="#1e293b" font-weight="600" font-family="monospace" text-anchor="end">$59.99</text>

  <!-- Code currency -->
  <rect x="28" y="242" width="376" height="22" rx="6" fill="#1e293b"/>
  <text x="36" y="257" font-size="10" fill="#94a3b8" font-family="monospace">{{ producto.precio | </text>
  <text x="168" y="257" font-size="10" fill="#c4b5fd" font-family="monospace">currency</text>
  <text x="214" y="257" font-size="10" fill="#fde68a" font-family="monospace">:'USD':'symbol':'1.2-2'</text>
  <text x="330" y="257" font-size="10" fill="#94a3b8" font-family="monospace"> }}</text>

  <!-- Card date -->
  <rect x="444" y="52" width="400" height="220" rx="12" fill="white" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="464" y="80" font-size="11" fill="#64748b" font-weight="700">📅  PIPE DATE — FECHA DE ALTA</text>

  <line x1="456" y1="88" x2="832" y2="88" stroke="#f1f5f9" stroke-width="1"/>
  <text x="464" y="110" font-size="12" fill="#64748b">Laptop Pro 15"</text>
  <text x="832" y="110" font-size="12" fill="#1e293b" text-anchor="end">15/01/2024</text>

  <line x1="456" y1="118" x2="832" y2="118" stroke="#f8fafc" stroke-width="1"/>
  <text x="464" y="140" font-size="12" fill="#64748b">Auriculares Bluetooth</text>
  <text x="832" y="140" font-size="12" fill="#1e293b" text-anchor="end">20/02/2024</text>

  <line x1="456" y1="148" x2="832" y2="148" stroke="#f8fafc" stroke-width="1"/>
  <text x="464" y="170" font-size="12" fill="#64748b">Teclado Mecánico RGB</text>
  <text x="832" y="170" font-size="12" fill="#1e293b" text-anchor="end">05/03/2024</text>

  <line x1="456" y1="178" x2="832" y2="178" stroke="#f8fafc" stroke-width="1"/>
  <text x="464" y="200" font-size="12" fill="#64748b">Monitor 4K 27"</text>
  <text x="832" y="200" font-size="12" fill="#1e293b" text-anchor="end">18/03/2024</text>

  <line x1="456" y1="208" x2="832" y2="208" stroke="#f8fafc" stroke-width="1"/>
  <text x="464" y="230" font-size="12" fill="#64748b">Mouse Ergonómico</text>
  <text x="832" y="230" font-size="12" fill="#1e293b" text-anchor="end">01/04/2024</text>

  <!-- Code date -->
  <rect x="456" y="242" width="376" height="22" rx="6" fill="#1e293b"/>
  <text x="464" y="257" font-size="10" fill="#94a3b8" font-family="monospace">{{ producto.fechaAlta | </text>
  <text x="584" y="257" font-size="10" fill="#c4b5fd" font-family="monospace">date</text>
  <text x="612" y="257" font-size="10" fill="#fde68a" font-family="monospace">:'dd/MM/yyyy'</text>
  <text x="696" y="257" font-size="10" fill="#94a3b8" font-family="monospace"> }}</text>

  <!-- Nota pie -->
  <rect x="16" y="280" width="828" height="24" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="430" y="296" font-size="11" fill="#166534" text-anchor="middle">Los pipes transforman la presentación sin modificar el dato original en el servicio</text>
</svg>
